name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: npm run check:js
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"
      - name: Import macOS Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_SIGN_IDENTITY" ]]; then
            echo 'Developer ID certificate secrets are not configured; using ad-hoc signing for this tag.'
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/modivue-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/modivue-developer-id.p12"
          echo "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/modivue-keychain-password"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          npm run check:desktop
          npm run desktop:build
          codesign --verify --deep --strict dist/Modivue.app
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            codesign --verify --deep --strict --verbose=2 dist/Modivue.app
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/Modivue.app "dist/Modivue-macos-$(uname -m).zip"
      - name: Notarize macOS release DMG
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -z "$MACOS_SIGN_IDENTITY" || -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$MACOS_KEYCHAIN_PATH" ]]; then
            echo 'Developer ID and notarization secrets are not configured; keeping an explicitly unsigned/ad-hoc ZIP.'
            exit 0
          fi
          bash scripts/package-macos-release.sh
      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$MACOS_KEYCHAIN_PATH" || true; fi
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: ./scripts/build-windows.ps1
      - name: Upload unsigned CI archive
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Modivue-${{ runner.os }}-unsigned
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Modivue-${{ runner.os }}-release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "Modivue $RELEASE_TAG" --prerelease
