name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: npm run check:js
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          npm run check:desktop
          npm run desktop:build
          codesign --verify --deep --strict dist/Modivue.app
          ditto -c -k --sequesterRsrc --keepParent dist/Modivue.app "dist/Modivue-macos-$(uname -m).zip"
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Modivue-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip --verify-tag --generate-notes --title "Modivue $RELEASE_TAG" --prerelease
