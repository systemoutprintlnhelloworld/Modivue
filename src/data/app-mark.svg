<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744.15 402.09" width="744" height="402" role="img" aria-label="M mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    几何由原图逐像素反解得到：两个圆头 V 形（chevron）描边叠放，右侧形状压在左侧之上。
    腿与竖直方向夹角 38.13°，描边宽 188.75（= 2 × 圆头半径 94.37）。
    viewBox 单位 = 原图像素 × 10。
  -->
  <defs>
    <!-- 左侧形状：右上青蓝 → 左下靛蓝 -->
    <linearGradient id="mk-a" gradientUnits="userSpaceOnUse" x1="293.68" y1="61.53" x2="46.18" y2="346.33">
      <stop offset="0"    stop-color="#3AA5F8"/>
      <stop offset="0.14" stop-color="#358BF8"/>
      <stop offset="0.29" stop-color="#3078F2"/>
      <stop offset="0.43" stop-color="#2663E2"/>
      <stop offset="0.57" stop-color="#265BE2"/>
      <stop offset="0.71" stop-color="#2B5AE8"/>
      <stop offset="0.86" stop-color="#345AF1"/>
      <stop offset="1"    stop-color="#3957F6"/>
    </linearGradient>
    <!-- 右侧形状：右上青 → 蓝紫 → 左下粉紫 -->
    <linearGradient id="mk-b" gradientUnits="userSpaceOnUse" x1="584.28" y1="60.23" x2="372.28" y2="413.03">
      <stop offset="0"    stop-color="#53E2FA"/>
      <stop offset="0.14" stop-color="#45BDFA"/>
      <stop offset="0.29" stop-color="#3894F5"/>
      <stop offset="0.43" stop-color="#307BF0"/>
      <stop offset="0.57" stop-color="#3F6FF8"/>
      <stop offset="0.71" stop-color="#6F6DFB"/>
      <stop offset="0.86" stop-color="#A774FA"/>
      <stop offset="1"    stop-color="#D895F7"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-width="188.75" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="url(#mk-a)" d="M94.37 292.78 L237.91 109.92 L362.46 268.59"/>
    <path stroke="url(#mk-b)" d="M333.45 307.71 L500.91 94.37 L649.77 284.01"/>
  </g>
</svg>
